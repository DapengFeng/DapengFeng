name: Recent public commits

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - README.zh-CN.md
      - scripts/update_recent_commits.py
      - tests/test_recent_commits.py
      - .github/workflows/recent-commits.yml

permissions:
  contents: write

concurrency:
  group: profile-recent-commits
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'DapengFeng/DapengFeng'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the updater
        run: python3 -B -m unittest discover -s tests -p 'test_recent_commits.py'

      - name: Refresh the public commit snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 -B scripts/update_recent_commits.py --user "$PROFILE_OWNER"

      - name: Commit changed activity only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add README.md README.zh-CN.md data/recent-commits.json
          if git diff --cached --quiet; then
            echo "No new public commits."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh public commit log [skip ci]'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
