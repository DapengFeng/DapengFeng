<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" fill="none" role="img" aria-labelledby="title description">
  <title id="title">I'm Dapeng Feng.</title>
  <desc id="description">A GitHub-style terminal introducing Dapeng Feng. Computer vision, robotics, and graphics. Ph.D. at Sun Yat-sen University, completed June 21, 2026. PhD merged. Questions still open.</desc>
  <defs>
    <clipPath id="terminal"><rect width="1000" height="350" rx="10"/></clipPath>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .cursor { animation: cursor 1.2s step-end infinite; }
    @keyframes cursor { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <g clip-path="url(#terminal)">
    <rect width="1000" height="350" fill="#ffffff"/>
    <path d="M0 0H1000V44H0Z" fill="#f6f8fa"/>
    <path d="M0 44H1000" stroke="#d0d7de"/>
    <g font-size="16">
      <text x="34" y="28" fill="#57606a">dapeng@github:~/profile</text>
      <text x="966" y="28" text-anchor="end" fill="#1a7f37">main</text>
    </g>
    <text x="34" y="88" font-size="20" fill="#1f2328"><tspan fill="#1a7f37">$</tspan> whoami</text>
    <rect class="cursor" x="142" y="72" width="10" height="20" fill="#1a7f37" aria-hidden="true"/>
    <text x="32" y="146" font-size="54" font-weight="500" letter-spacing="-1.5" fill="#1f2328">I'm Dapeng Feng.</text>
    <text x="34" y="181" font-size="20" fill="#57606a">Computer vision / Robotics / Graphics</text>
    <text x="34" y="224" font-size="20" fill="#1f2328"><tspan fill="#1a7f37">$</tspan> cat education.log</text>
    <g font-size="20">
      <text x="34" y="256" fill="#1a7f37">[merged]</text>
      <text x="160" y="256" fill="#1f2328">Ph.D. · Sun Yat-sen University</text>
      <text x="34" y="285" fill="#57606a">[date]</text>
      <text x="160" y="285" fill="#1f2328">2026-06-21</text>
    </g>
    <text x="34" y="321" font-size="18" fill="#57606a">// PhD merged. Questions still open.</text>
    <rect x=".5" y=".5" width="999" height="349" rx="9.5" stroke="#d0d7de"/>
  </g>
</svg>
